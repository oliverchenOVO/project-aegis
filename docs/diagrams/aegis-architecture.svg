  <title id="title">Project AEGIS 系統架構與情報邊界</title>
  <desc id="desc">
    React 與 Pixi 透過 CommandPort 向獨立 Web Worker
    發出操作命令。權威世界只經觀測、傳輸和知識投影回傳已接收 DTO。Worker
    負責重播、事後分析和存檔校驗，Electron 橋接負責磁碟存取。
  </desc>
